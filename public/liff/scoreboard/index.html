<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>得点ボード</title>
<link rel="stylesheet" href="/liff/score.css?v=1">
</head>
<body>

<nav class="tabs">
  <a class="tab-home" href="/liff/" title="メニューへ">‹ Top</a>
  <button class="tab-btn active" id="tabbtn-game"    onclick="showTab('game')">🏁 ボード</button>
  <button class="tab-btn"        id="tabbtn-history" onclick="showTab('history')">📜 履歴</button>
  <button class="tab-btn"        id="tabbtn-stats"   onclick="showTab('stats')">🏆 成績</button>
</nav>

<div id="tab-game" class="page active"><div id="game-root"><div class="empty">読み込み中…</div></div></div>
<div id="tab-history" class="page"><div id="history-root"><div class="empty">読み込み中…</div></div></div>
<div id="tab-stats" class="page"><div id="stats-root"><div class="empty">読み込み中…</div></div></div>

<div class="detail-page" id="detail">
  <div class="detail-header">
    <button class="btn-back" onclick="closeDetail()">‹</button>
    <div class="detail-header-title">ボードの詳細</div>
  </div>
  <div class="detail-content" id="detail-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="/liff/config.js"></script>
<script src="/liff/liffauth.js?v=1"></script>
<script src="/liff/scoreboard/scoreboard.js?v=1"></script>
</body>
</html>
