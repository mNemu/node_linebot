<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2500 1124" font-family="sans-serif">
  <!-- 3x2 cells: columns x=0/833/1666 (w 833/833/834), rows y=0/562 (h 562) -->
  <rect x="0" y="0" width="833" height="562" fill="#5b21b6"/>
  <rect x="833" y="0" width="833" height="562" fill="#0f766e"/>
  <rect x="1666" y="0" width="834" height="562" fill="#334155"/>
  <rect x="0" y="562" width="833" height="562" fill="#b45309"/>
  <rect x="833" y="562" width="833" height="562" fill="#15803d"/>
  <rect x="1666" y="562" width="834" height="562" fill="#4338ca"/>

  <!-- Dividers -->
  <rect x="829" y="0" width="8" height="1124" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="1662" y="0" width="8" height="1124" fill="#ffffff" fill-opacity="0.25"/>
  <rect x="0" y="558" width="2500" height="8" fill="#ffffff" fill-opacity="0.25"/>

  <!-- (0,0) dice input form -->
  <g transform="translate(416,200)">
    <rect x="-95" y="-95" width="190" height="190" rx="36" fill="#ffffff"/>
    <circle cx="-42" cy="-42" r="17" fill="#1f2937"/><circle cx="42" cy="-42" r="17" fill="#1f2937"/>
    <circle cx="0" cy="0" r="17" fill="#1f2937"/>
    <circle cx="-42" cy="42" r="17" fill="#1f2937"/><circle cx="42" cy="42" r="17" fill="#1f2937"/>
  </g>
  <text x="416" y="408" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">サイコロ</text>
  <text x="416" y="462" font-size="30" fill="#e9d5ff" text-anchor="middle">タップで入力</text>

  <!-- (1,0) diet input form -->
  <g transform="translate(1250,200)">
    <circle cx="0" cy="0" r="95" fill="#ffffff"/>
    <path d="M -44 -36 L 14 22 M 14 22 L 14 -18 M 14 22 L -26 22" stroke="#0f766e" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="1250" y="408" font-size="50" font-weight="bold" fill="#ffffff" text-anchor="middle">ダイエット試算</text>
  <text x="1250" y="462" font-size="30" fill="#ccfbf1" text-anchor="middle">タップで入力</text>

  <!-- (2,0) help / menu -->
  <g transform="translate(2083,200)">
    <circle cx="0" cy="0" r="95" fill="#ffffff"/>
    <text x="0" y="36" font-size="118" font-weight="bold" fill="#334155" text-anchor="middle">?</text>
  </g>
  <text x="2083" y="408" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">メニュー</text>

  <!-- (0,1) molkky: pins + throwing stick -->
  <g transform="translate(416,762)">
    <rect x="-100" y="-100" width="200" height="200" rx="36" fill="#ffffff"/>
    <rect x="-62" y="-30" width="30" height="95" rx="12" fill="#b45309"/>
    <rect x="-15" y="-60" width="30" height="125" rx="12" fill="#b45309"/>
    <rect x="32" y="-40" width="30" height="105" rx="12" fill="#b45309"/>
    <circle cx="-47" cy="-42" r="12" fill="#fbbf24"/><circle cx="0" cy="-72" r="12" fill="#fbbf24"/><circle cx="47" cy="-52" r="12" fill="#fbbf24"/>
  </g>
  <text x="416" y="970" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">モルック</text>
  <text x="416" y="1024" font-size="30" fill="#fde68a" text-anchor="middle">得点記録</text>

  <!-- (1,1) golf: flag + ball -->
  <g transform="translate(1250,762)">
    <rect x="-100" y="-100" width="200" height="200" rx="36" fill="#ffffff"/>
    <line x1="-10" y1="-70" x2="-10" y2="55" stroke="#15803d" stroke-width="12" stroke-linecap="round"/>
    <polygon points="-4,-70 66,-45 -4,-20" fill="#ef4444"/>
    <circle cx="-48" cy="52" r="17" fill="#15803d"/>
    <ellipse cx="0" cy="66" rx="80" ry="12" fill="#15803d" fill-opacity="0.25"/>
  </g>
  <text x="1250" y="970" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">ゴルフ</text>
  <text x="1250" y="1024" font-size="30" fill="#bbf7d0" text-anchor="middle">スコア記録</text>

  <!-- (2,1) generic score board: podium bars -->
  <g transform="translate(2083,762)">
    <rect x="-100" y="-100" width="200" height="200" rx="36" fill="#ffffff"/>
    <rect x="-70" y="-10" width="40" height="80" rx="6" fill="#4338ca"/>
    <rect x="-20" y="-60" width="40" height="130" rx="6" fill="#4338ca"/>
    <rect x="30" y="20" width="40" height="50" rx="6" fill="#4338ca"/>
  </g>
  <text x="2083" y="970" font-size="54" font-weight="bold" fill="#ffffff" text-anchor="middle">得点ボード</text>
  <text x="2083" y="1024" font-size="30" fill="#c7d2fe" text-anchor="middle">何でも集計</text>
</svg>
